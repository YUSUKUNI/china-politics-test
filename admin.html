<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>测试数据导出</title>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --border: #cbd5e1;
  --success: #047857;
  --error: #b91c1c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
}

.admin-card {
  width: min(100%, 560px);
  padding: 28px;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  background: var(--card);
  box-shadow: 0 12px 30px rgb(15 23 42 / 0.08);
}

h1 { margin: 0 0 8px; font-size: 1.45rem; }

.description {
  margin: 0 0 22px;
  color: var(--muted);
  line-height: 1.65;
}

label { display: block; margin-bottom: 7px; font-weight: 650; }

input {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  font: inherit;
}

input:focus-visible {
  outline: 3px solid #bfdbfe;
  border-color: var(--primary);
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 11px 16px;
  border: 0;
  border-radius: 9px;
  background: var(--primary);
  color: #ffffff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

button:hover:not(:disabled) { background: var(--primary-hover); }
button:disabled { cursor: not-allowed; opacity: 0.55; }

.status {
  min-height: 1.6em;
  margin: 14px 0 0;
  line-height: 1.55;
}

.status.success { color: var(--success); }
.status.error { color: var(--error); }

.back-link {
  display: inline-block;
  margin-top: 20px;
  color: var(--primary);
  text-decoration: none;
}

.back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="admin-card">
  <h1>测试数据导出</h1>
  <p class="description">
    输入 Cloudflare Worker 的 <code>ADMIN_EXPORT_TOKEN</code>，下载包含原始答案、八轴分数和百分比的 CSV。令牌只保留在当前页面内存中。
  </p>
  <label for="token">管理令牌</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Bearer token">
  <button id="download" type="button">下载 CSV</button>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <a class="back-link" href="index.html">返回测试页面</a>
</main>

<script src="api-config.js"></script>
<script>
const API_BASE=String(globalThis.POLITICS_TEST_CONFIG?.apiBase||"").replace(/\/+$/,"");
const tokenInput=document.getElementById("token");
const downloadButton=document.getElementById("download");
const statusBox=document.getElementById("status");

function setStatus(message,type=""){
  statusBox.textContent=message;
  statusBox.className=type?`status ${type}`:"status";
}

function filenameFromResponse(response){
  const header=response.headers.get("Content-Disposition")||"";
  const match=header.match(/filename="?([^";]+)"?/i);
  return match?match[1]:`china-politics-results-${new Date().toISOString().slice(0,10)}.csv`;
}

async function downloadCsv(){
  const token=tokenInput.value.trim();
  if(!API_BASE){
    setStatus("尚未配置 Worker 地址，请先在 api-config.js 中填写 apiBase。","error");
    return;
  }
  if(!token){
    setStatus("请输入管理令牌。","error");
    tokenInput.focus();
    return;
  }

  downloadButton.disabled=true;
  setStatus("正在生成 CSV…");

  try{
    const response=await fetch(`${API_BASE}/api/admin/results.csv`,{
      method:"GET",
      headers:{Authorization:`Bearer ${token}`},
      credentials:"omit",
      cache:"no-store"
    });

    if(!response.ok){
      let message=`HTTP ${response.status}`;
      try{
        const data=await response.json();
        message=data.message||message;
      }catch{
      }
      throw new Error(message);
    }

    const blob=await response.blob();
    const objectUrl=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=objectUrl;
    link.download=filenameFromResponse(response);
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl),1000);
    setStatus("CSV 已生成并开始下载。","success");
  }catch(error){
    console.error("CSV 导出失败：",error);
    setStatus(`导出失败：${error.message}`,"error");
  }finally{
    downloadButton.disabled=false;
  }
}

downloadButton.addEventListener("click",downloadCsv);
tokenInput.addEventListener("keydown",event=>{
  if(event.key==="Enter")downloadCsv();
});

if(!API_BASE){
  setStatus("尚未配置 Worker 地址，请先在 api-config.js 中填写 apiBase。","error");
}
</script>
</body>
</html>
