<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>中国政治议题测试</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f1117;
  color:#f2f4f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
  "Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

.container{
  width:min(760px,92%);
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:30px 0;
}

.card{
  background:#181b23;
  border:1px solid #292e3a;
  border-radius:20px;
  padding:30px;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
}

h1{
  font-size:30px;
  margin:0 0 14px;
}

h2{
  font-size:24px;
  line-height:1.5;
}

p{
  color:#b7bdc9;
  line-height:1.8;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 20px;
  font-size:16px;
  cursor:pointer;
}

.primary{
  width:100%;
  background:#f2f4f8;
  color:#111;
  font-weight:700;
  margin-top:18px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  background:#20242e;
  color:#f2f4f8;
  border:1px solid #303643;
  margin:10px 0;
  transition:.15s;
}

.option:hover{
  background:#292e39;
}

.option.selected{
  background:#394150;
  border-color:#8e98aa;
}

.hidden{
  display:none!important;
}

.progress-wrap{
  margin-bottom:25px;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  color:#9da5b4;
  font-size:14px;
  margin-bottom:8px;
}

.progress{
  height:7px;
  background:#272c36;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0;
  background:#f2f4f8;
  transition:.3s;
}

.question-number{
  color:#9da5b4;
  font-size:14px;
  margin-bottom:8px;
}

.nav{
  display:flex;
  gap:10px;
  margin-top:22px;
}

.nav button{
  flex:1;
}

.secondary{
  background:#272c36;
  color:#f2f4f8;
}

.result-title{
  margin-bottom:8px;
}

.axis{
  margin:27px 0;
}

.axis-title{
  font-size:17px;
  font-weight:700;
  margin-bottom:9px;
}

.axis-labels{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  color:#aeb5c2;
  margin-bottom:7px;
}

.axis-line{
  height:9px;
  background:#2b303b;
  border-radius:10px;
  position:relative;
}

.axis-mid{
  position:absolute;
  left:50%;
  top:-5px;
  width:1px;
  height:19px;
  background:#646c7b;
}

.axis-dot{
  position:absolute;
  top:50%;
  transform:translate(-50%,-50%);
  width:19px;
  height:19px;
  border-radius:50%;
  background:#fff;
  border:3px solid #11151c;
  box-shadow:0 0 0 2px #fff;
}

.axis-score{
  text-align:center;
  color:#9da5b4;
  font-size:12px;
  margin-top:7px;
}

.note{
  background:#20242d;
  border-radius:12px;
  padding:15px;
  color:#aeb5c2;
  font-size:13px;
  line-height:1.7;
  margin-top:25px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.actions button{
  flex:1;
}

@media(max-width:600px){
  .container{
    width:94%;
    padding:15px 0;
  }

  .card{
    padding:22px 17px;
    border-radius:16px;
  }

  h1{
    font-size:25px;
  }

  h2{
    font-size:20px;
  }

  .axis-labels{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- START -->
  <div id="startScreen" class="card">
    <h1>中国政治议题测试</h1>

    <p>
      本测试通过一系列公共政策、社会制度、政治制度、
      民族文化及外交议题，呈现你的议题倾向。
    </p>

    <p>
      测试结果仅表示你在本测试所选议题上的回答分布，
      不代表任何政党、政治人物或现实政治立场。
    </p>

    <button class="primary" id="startBtn">开始测试</button>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="card hidden">

    <div class="progress-wrap">
      <div class="progress-info">
        <span id="sectionName"></span>
        <span id="progressText"></span>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="question-number" id="questionNumber"></div>

    <h2 id="questionText"></h2>

    <div id="options"></div>

    <div class="nav">
      <button class="secondary" id="prevBtn">上一题</button>
      <button class="primary" id="nextBtn">下一题</button>
    </div>

  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="card hidden">

    <h1 class="result-title">你的测试结果</h1>

    <p>
      以下结果是根据你对各问题的回答计算出的八个独立维度。
      每条轴只计算与该维度相关的问题。
    </p>

    <div id="results"></div>

    <div class="note">
      <strong>如何理解结果？</strong><br><br>
      每条轴的左右两端只是两个相反的政策取向。
      位置越靠近某一侧，表示你的回答在本测试所选议题中
      更接近该方向。不同维度彼此独立，例如“大政府”
      并不意味着一定倾向“权力集中”。
    </div>

    <div class="actions">
      <button class="secondary" id="shareBtn">分享结果</button>
      <button class="primary" id="restartBtn">重新测试</button>
    </div>

  </div>

</div>

<script>

/* =========================
   题目
========================= */

const questions = [

/* 财政问题 */
{
 section:"财政问题",
 text:"你是否支持保护房价？",
 effects:{
   government:1,
   income:0.8
 }
},

{
 section:"财政问题",
 text:"你是否支持继续大基建拉动经济？",
 effects:{
   government:1,
   income:0.6
 }
},

{
 section:"财政问题",
 text:"你是否支持设立最低工资？",
 effects:{
   government:1,
   income:1
 }
},

{
 section:"财政问题",
 text:"你是否支持个人购置城市土地建房子？",
 effects:{
   government:-0.5,
   income:0.7
 }
},

{
 section:"财政问题",
 text:"你是否支持每人每年一个固定数额的医保和退休金制度支出？",
 effects:{
   government:1,
   income:1
 }
},

/* 社会制度 */
{
 section:"社会制度",
 text:"你是否支持取消户口自由迁徙限制？",
 effects:{
   government:-1,
   income:1
 }
},

{
 section:"社会制度",
 text:"你是否支持婚前财产不会因为离婚而分割？",
 effects:{
   income:-1
 }
},

{
 section:"社会制度",
 text:"你是否支持设立保护同性伴侣同等民事权利的制度？",
 effects:{
   social:1
 }
},

{
 section:"社会制度",
 text:"你是否支持犯罪记录公开，服刑过后依然保留相关标签？",
 effects:{
   social:-1
 }
},

{
 section:"社会制度",
 text:"你是否支持身份证上划分各民族？",
 effects:{
   han:-0.8
 }
},

/* 税收 */
{
 section:"税收",
 text:"你是否支持购买商品时标注消费税数额？",
 effects:{
   government:0.2
 }
},

{
 section:"税收",
 text:"你是否支持设立房产税？",
 effects:{
   government:0.7,
   income:1
 }
},

{
 section:"税收",
 text:"你是否支持下调个人所得税起征点？",
 effects:{
   government:0.7,
   income:1
 }
},

{
 section:"税收",
 text:"你是否支持设立遗产税？",
 effects:{
   government:0.7,
   income:1
 }
},

{
 section:"税收",
 text:"你是否支持增加企业所得税？",
 effects:{
   government:0.7,
   income:1
 }
},

/* 政治制度 */
{
 section:"政治制度",
 text:"你是否支持多党制？",
 effects:{
   political:1
 }
},

{
 section:"政治制度",
 text:"你是否支持自由结社权利以及宗教信仰自由？",
 effects:{
   political:1
 }
},

{
 section:"政治制度",
 text:"你是否支持报社新闻媒体自由？",
 effects:{
   political:1
 }
},

{
 section:"政治制度",
 text:"你是否支持互联网城墙？",
 effects:{
   political:-1
 }
},

{
 section:"政治制度",
 text:"你是否支持民选产生官员？",
 effects:{
   political:1
 }
},

/* 民族文化 */
{
 section:"民族文化",
 text:"你是否支持中华文化是以汉族文化为主导的？",
 effects:{
   han:1,
   culture:-0.5
 }
},

{
 section:"民族文化",
 text:"你是否支持对少数民族地区推行汉化政策？",
 effects:{
   han:1,
   culture:-0.7
 }
},

{
 section:"民族文化",
 text:"你是否支持保护少数民族文化语言的专项政策，包括地方方言？",
 effects:{
   han:-1,
   culture:1
 }
},

{
 section:"民族文化",
 text:"你是否支持过洋节？",
 effects:{
   culture:1,
   west:1
 }
},

{
 section:"民族文化",
 text:"你是否支持设立一门外语作为义务教育主课？",
 effects:{
   culture:1,
   west:1
 }
},

/* 外交 */
{
 section:"地缘外交",
 text:"关于台湾问题，你是否支持维持现状、坚持一个中国各自表述，而不以武力解决？",
 effects:{
   peace:1,
   west:0.5
 }
},

{
 section:"地缘外交",
 text:"你是否支持俄罗斯入侵乌克兰？",
 effects:{
   peace:-1,
   west:-2
 }
},

{
 section:"地缘外交",
 text:"你是否支持美国进攻伊朗？",
 effects:{
   peace:-1,
   west:2
 }
},

{
 section:"地缘外交",
 text:"你是否支持哈马斯进攻以色列？",
 effects:{
   peace:-1,
   west:-2
 }
},

{
 section:"地缘外交",
 text:"如果有可能，你是否支持尝试恢复部分外东北、外西北，甚至蒙古地区？",
 effects:{
   peace:-1,
   han:1,
   west:0.5
 }
}

];


/* =========================
   轴定义
========================= */

const axes = [

{
 key:"government",
 title:"政府规模",
 left:"小政府",
 right:"大政府"
},

{
 key:"income",
 title:"经济分配",
 left:"偏高收入",
 right:"偏低收入"
},

{
 key:"social",
 title:"社会价值",
 left:"社会保守",
 right:"社会自由"
},

{
 key:"political",
 title:"政治制度",
 left:"权力集中",
 right:"政治开放"
},

{
 key:"han",
 title:"民族文化",
 left:"大汉族主义",
 right:"多元文化"
},

{
 key:"culture",
 title:"文化取向",
 left:"文化保守",
 right:"文化开放"
},

{
 key:"peace",
 title:"外交军事",
 left:"和平主义",
 right:"武力主义"
},

{
 key:"west",
 title:"国际取向",
 left:"亲欧美",
 right:"反欧美中心"
}

];


/* =========================
   状态
========================= */

let current = 0;
let answers = new Array(questions.length).fill(null);


/* =========================
   DOM
========================= */

const startScreen = document.getElementById("startScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");

const startBtn = document.getElementById("startBtn");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");

const questionText = document.getElementById("questionText");
const questionNumber = document.getElementById("questionNumber");
const sectionName = document.getElementById("sectionName");
const optionsBox = document.getElementById("options");

const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");

const resultsBox = document.getElementById("results");

const shareBtn = document.getElementById("shareBtn");
const restartBtn = document.getElementById("restartBtn");


/* =========================
   选项
========================= */

const optionNames = [
 "很支持",
 "一般支持",
 "中立",
 "一般不支持",
 "很不支持"
];

const optionValues = [
 2,
 1,
 0,
 -1,
 -2
];


/* =========================
   开始
========================= */

startBtn.addEventListener("click",()=>{
 startScreen.classList.add("hidden");
 quizScreen.classList.remove("hidden");
 renderQuestion();
});


/* =========================
   显示题目
========================= */

function renderQuestion(){

 const q = questions[current];

 questionText.textContent = q.text;

 questionNumber.textContent =
   "第 " + (current+1) + " 题";

 sectionName.textContent = q.section;

 progressText.textContent =
   (current+1) + " / " + questions.length;

 progressBar.style.width =
   ((current+1)/questions.length*100) + "%";

 optionsBox.innerHTML = "";

 optionNames.forEach((name,i)=>{

   const btn = document.createElement("button");

   btn.className = "option";
   btn.textContent = name;

   if(answers[current] === optionValues[i]){
     btn.classList.add("selected");
   }

   btn.addEventListener("click",()=>{

     answers[current] = optionValues[i];

     document.querySelectorAll(".option")
       .forEach(x=>x.classList.remove("selected"));

     btn.classList.add("selected");

   });

   optionsBox.appendChild(btn);

 });

 prevBtn.style.visibility =
   current === 0 ? "hidden" : "visible";

 nextBtn.textContent =
   current === questions.length-1
   ? "查看结果"
   : "下一题";
}


/* =========================
   下一题
========================= */

nextBtn.addEventListener("click",()=>{

 if(answers[current] === null){
   alert("请选择一个答案");
   return;
 }

 if(current < questions.length-1){

   current++;
   renderQuestion();

 }else{

   showResults();

 }

});


/* =========================
   上一题
========================= */

prevBtn.addEventListener("click",()=>{

 if(current > 0){

   current--;
   renderQuestion();

 }

});


/* =========================
   计算结果
========================= */

function calculateScores(){

 const scores = {};

 axes.forEach(axis=>{
   scores[axis.key] = 0;
 });

 questions.forEach((q,index)=>{

   if(answers[index] === null) return;

   const answer = answers[index];

   Object.keys(q.effects).forEach(key=>{

     scores[key] += answer * q.effects[key];

   });

 });

 return scores;
}


/* =========================
   显示结果
========================= */

function showResults(){

 const scores = calculateScores();

 quizScreen.classList.add("hidden");
 resultScreen.classList.remove("hidden");

 resultsBox.innerHTML = "";

 axes.forEach(axis=>{

   const raw = scores[axis.key];

   /*
     将分数标准化到 -100 ~ +100
     最大可能值不会固定，因此用
     当前维度理论最大值计算。
   */

   let max = 0;

   questions.forEach(q=>{

     if(q.effects[axis.key]){
       max += 2 * Math.abs(q.effects[axis.key]);
     }

   });

   if(max === 0) max = 1;

   let normalized =
     (raw / max) * 100;

   normalized =
     Math.max(-100,Math.min(100,normalized));

   const position =
     50 + normalized/2;

   const div =
     document.createElement("div");

   div.className = "axis";

   div.innerHTML = `
     <div class="axis-title">${axis.title}</div>

     <div class="axis-labels">
       <span>${axis.left}</span>
       <span>${axis.right}</span>
     </div>

     <div class="axis-line">
       <div class="axis-mid"></div>
       <div class="axis-dot"
         style="left:${position}%">
       </div>
     </div>

     <div class="axis-score">
       ${normalized > 3 ? "偏向 " + axis.right :
         normalized < -3 ? "偏向 " + axis.left :
         "接近中间"}
     </div>
   `;

   resultsBox.appendChild(div);

 });

 window.scrollTo({
   top:0,
   behavior:"smooth"
 });

}


/* =========================
   分享
========================= */

shareBtn.addEventListener("click",async()=>{

 const text =
 `我完成了“中国政治议题测试”。

8个维度：
政府规模
经济分配
社会价值
政治制度
民族文化
文化取向
外交军事
国际取向

测试地址：
${location.href}`;

 try{

   if(navigator.share){

     await navigator.share({
       title:"中国政治议题测试",
       text:text
     });

   }else{

     await navigator.clipboard.writeText(text);
     alert("结果分享文字已经复制");

   }

 }catch(e){}

});


/* =========================
   重新测试
========================= */

restartBtn.addEventListener("click",()=>{

 current = 0;
 answers = new Array(questions.length).fill(null);

 resultScreen.classList.add("hidden");
 startScreen.classList.remove("hidden");

 window.scrollTo({
   top:0,
   behavior:"smooth"
 });

});

</script>

</body>
</html>
